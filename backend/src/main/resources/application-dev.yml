app:
  security:
    enable-default-admin: ${DEV_ADMIN_BOOTSTRAP_ENABLED:false}
    default-admin-email: ${DEV_ADMIN_EMAIL:}
    default-admin-password: ${DEV_ADMIN_PASSWORD:}
    trust-proxy-headers: false
    qr-secret: ${QR_SIGNING_SECRET:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://localhost,capacitor://localhost}

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      ssl:
        enabled: false

auth:
  password-reset:
    phone-enabled: true
    dev-log-otp: true

security:
  jwt:
    refresh-cookie-secure: false
    refresh-cookie-same-site: Lax

gemini:
  enabled: ${GEMINI_ENABLED:false}

logging:
  level:
    com.qros: DEBUG
    org.hibernate.SQL: DEBUG
