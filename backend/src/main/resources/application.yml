spring:
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000
      keepalive-time: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    # Existing databases must be explicitly baselined during deployment.
    # Automatic baselining can silently skip historical migrations on a drifted schema.
    baseline-on-migrate: false

  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    time-zone: Asia/Ho_Chi_Minh
    default-property-inclusion: non_null

  mvc:
    problemdetails:
      enabled: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  cache:
    type: ${SPRING_CACHE_TYPE:caffeine}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

auth:
  lockout:
    max-failed-attempts: 5
    duration: 15m
  password-reset:
    phone-enabled: false
    dev-log-otp: false
    sms:
      otp-message-template: "${SMS_OTP_MESSAGE_TEMPLATE:Your QROS password reset OTP is %s. It expires in 5 minutes.}"
  rate-limit:
    login-ip:
      max-requests: 10
      window: 1m
    login-account:
      max-requests: 5
      window: 1m
    forgot-password-ip:
      max-requests: 10
      window: 15m
    forgot-password-account:
      max-requests: 3
      window: 15m
    password-reset-ip:
      max-requests: 10
      window: 15m
    password-reset-account:
      max-requests: 5
      window: 15m
    refresh-ip:
      max-requests: 30
      window: 1m

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types:
      - text/html
      - text/xml
      - text/plain
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - application/xml
    min-response-size: 1024
  error:
    include-message: never
    include-binding-errors: never

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    refresh-cookie-name: refreshToken

rate-limit:
  rules:
    - scope: public:ai
      path: /api/v1/public/ai/chat
      method: POST
      max-requests: 10
      window: 1m
    - scope: public:orders
      path: /api/v1/public/orders/**
      method: POST
      max-requests: 10
      window: 1m
    - scope: public:start-session
      path: /api/v1/public/tables/*/start-session
      method: POST
      max-requests: 5
      window: 1m
    - scope: public:heartbeat
      path: /api/v1/public/sessions/heartbeat
      method: POST
      max-requests: 30
      window: 1m
    - scope: public:session-state
      path: /api/v1/public/tables/*/session-state
      method: GET
      max-requests: 30
      window: 1m
    - scope: public:recommendations
      path: /api/v1/recommendations/**
      method: GET
      max-requests: 30
      window: 1m
    - scope: public:webhooks
      path: /api/v1/webhooks/**
      method: POST
      max-requests: 60
      window: 1m

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}

app:
  base-url: ${APP_BASE_URL}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL}
  cache:
    prefix:  "qros:v3:"
  email:
    from-name: QROS
    brand-name: QROS
    copyright: 2026 QROS

payos:
  client-id: ${PAYOS_CLIENT_ID}
  api-key: ${PAYOS_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: prometheus,health
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: never
      probes:
        enabled: true

analytics:
  summary-reconcile-cron: "0 */15 * * * *"
  summary-reconcile-zone: Asia/Ho_Chi_Minh
  summary-reconcile-days: 2

table-session:
  no-order-expire: 30m
  token-idle-timeout: 2h
  token-max-lifetime: 12h
  heartbeat-write-interval: 30s
  max-active-tokens-per-session: 8
  cleanup-fixed-delay-ms: 300000

gemini:
  api-key: ${GEMINI_API_KEY}
  api-url: ${GEMINI_API_URL}
  connect-timeout-seconds: 5
  read-timeout-seconds: 15
  temperature: 0.7
  top-p: 0.9
  max-output-tokens: 500

ai:
  quota:
    public-ip:
      max-requests: 10
      window: 1m
    public-ip-daily:
      max-requests: 100
      window: 1d
    staff-user:
      max-requests: 20
      window: 1m
    staff-user-daily:
      max-requests: 300
      window: 1d
    menu-user:
      max-requests: 10
      window: 1m
    menu-user-daily:
      max-requests: 100
      window: 1d

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: INFO
