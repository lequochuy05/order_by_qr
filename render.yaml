services:
  - type: web
    name: qros-backend
    runtime: image
    repo: https://github.com/lequochuy05/order-by-qr
    branch: master
    dockerfilePath: Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: qros-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: qros-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: qros-db
          property: password
      - key: REDIS_HOST
        fromService:
          type: redis
          name: qros-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: qros-redis
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 900000
      - key: JWT_REFRESH_EXPIRATION_MS
        value: 604800000
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: APP_BASE_URL
        value: https://order-by-qr.onrender.com
      - key: APP_FRONTEND_BASE_URL
        value: https://wqros.vercel.app
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://wqros.vercel.app
      - key: APP_TRUST_PROXY_HEADERS
        value: true
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: GEMINI_ENABLED
        value: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent

  - type: redis
    name: qros-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: qros-db
    plan: free
    databaseType: postgresql
    ipAllowList: []
